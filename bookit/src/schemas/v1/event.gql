type Event {
  id: String
  start: String!
  end: String!
  description: String
  title: String!
  created_at: String
  updated_at: String
  room: [Room!]!
  phone: String!
  booked_as: String!
  booked_by: String!
  "Whether the signed-in user may edit or delete this booking."
  can_edit: Boolean!
  "Whether the signed-in user may move this booking by dragging it."
  can_move: Boolean!
}

type Query {
  events: [Event]
  event(id: String): Event
  eventsFT(from: String!, to: String!): [Event]
}

input InputEvent {
  id: String
  start: String!
  end: String!
  description: String
  title: String!
  created_at: String
  updated_at: String
  room: [Room]!
  phone: String
  booked_as: String!
  booking_terms: Boolean!
}

type Mutation {
  createEvent(event: InputEvent): Error
  editEvent(event: InputEvent): Error
  moveEvent(
    id: String!
    start: String!
    end: String!
    previousStart: String!
    previousEnd: String!
  ): Error
  deleteEvent(id: String): Error
}
