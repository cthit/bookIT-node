name: Release images

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag tested images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Load the release commit's successful CI image digests
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ||
                "$RELEASE_TAG" == latest || "$RELEASE_TAG" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Release tags must be valid Docker tags, not latest or a commit SHA." >&2
            exit 1
          fi
          run="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f status=success -f per_page=1 \
            --jq '.workflow_runs[0] | select(. != null) | [.id, .run_attempt] | @tsv')"
          if [[ -z "$run" ]]; then
            echo "No successful push CI run for $GITHUB_SHA. Wait for CI, then rerun this release workflow." >&2
            exit 1
          fi
          read -r run_id attempt <<< "$run"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "tested-images-$attempt" --dir tested
          jq -e --arg sha "$GITHUB_SHA" '.sha == $sha' tested/tested-images.json
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply the release tag without rebuilding
        shell: bash
        run: |
          for component in frontend backend; do
            image="$(jq -er --arg component "$component" '.[$component]' tested/tested-images.json)"
            repository="ghcr.io/${GITHUB_REPOSITORY,,}-$component"
            digest="${image##*@}"
            [[ "$image" == "$repository@$digest" && "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            docker buildx imagetools inspect "$image" > /dev/null
          done
          for component in frontend backend; do
            image="$(jq -r --arg component "$component" '.[$component]' tested/tested-images.json)"
            target="${image%@*}:$RELEASE_TAG"
            docker buildx imagetools create --prefer-index=false --tag "$target" "$image"
            actual="$(docker buildx imagetools inspect "$target" --format '{{.Manifest.Digest}}')"
            test "$actual" = "${image##*@}"
          done
