name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication and release tagging for the same commit.
concurrency:
  group: images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      save-image: true

  publish:
    name: Publish
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      BOOKIT_IMAGE: ghcr.io/cthit/bookit:${{ github.sha }}
    steps:
      - name: Download the tested image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bookit-image
          path: ${{ runner.temp }}
      - name: Load the tested image
        run: docker load --input "$RUNNER_TEMP/bookit.tar"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish without rebuilding
        run: docker push "$BOOKIT_IMAGE"
