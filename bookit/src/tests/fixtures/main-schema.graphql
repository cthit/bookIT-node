# Public schema from main at 2378a27. Keep as the compatibility baseline.
type Error {
  sv: String!
  en: String!
}

type Event {
  id: String
  start: String!
  end: String!
  description: String
  title: String!
  created_at: String
  updated_at: String
  room: [Room]!
  phone: String!
  booked_as: String!
  booked_by: String!
}

type Query {
  events: [Event]
  event(id: String): Event
  eventsFT(from: String!, to: String!): [Event]
}

input InputEvent {
  id: String
  start: String!
  end: String!
  description: String
  title: String!
  created_at: String
  updated_at: String
  room: [Room]!
  phone: String!
  booked_as: String!
  booking_terms: Boolean!
}

type Mutation {
  createEvent(event: InputEvent): Error
  editEvent(event: InputEvent): Error
  deleteEvent(id: String): Error
}

type IllegalSlot {
  start: String!
  end: String!
  description: String
  title: String!
}

type Query {
  illegalSlots(from: String!, to: String!): [IllegalSlot!]
}

enum Room {
  BIG_HUB
  GROUP_ROOM
  CTC
  THE_CLOUD
}

type Rule {
  id: String
  day_mask: Int
  start_date: String
  end_date: String
  start_time: String
  end_time: String
  description: String
  allow: Boolean
  priority: Int
  title: String
  created_at: String
  updated_at: String
  room: [Room]
}

input InputRule {
  id: String
  day_mask: Int
  start_date: String!
  end_date: String!
  start_time: String!
  end_time: String!
  description: String!
  allow: Boolean
  priority: Int
  title: String!
  created_at: String
  updated_at: String
  room: [Room]!
}

type Query {
  rules: [Rule]
  rule(id: String): Rule
}

type Mutation {
  createRule(rule: InputRule): Error
  deleteRule(id: String): Boolean
}

type User {
  sid: String
  sub: String
  given_name: String
  locale: String
  picture: String
  name: String
  nickname: String
  family_name: String
  jti: String
  cid: String
  groups: [String]
  is_admin: Boolean
}

type Query {
  user: User
}
