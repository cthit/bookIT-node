name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.sha }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  quality:
    name: Types, lint, tests, build, and dependency audit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: "24.19.0"
          version: "0.3.0"
          run-install: false
          cache: true
      - name: Install the packageManager-pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install approved dependencies from the lockfile
        run: vp install --frozen-lockfile
      - name: Generate GraphQL contracts and check they are committed
        run: |
          pnpm codegen
          git diff --exit-code -- backend/src/generated/schema.ts frontend/src/generated/graphql.ts
      - name: Generate Prisma client
        run: pnpm --dir backend exec prisma generate
      - name: Check strict TypeScript contracts
        run: pnpm typecheck
      - name: Check formatting and type-aware lint
        run: vp check
      - name: Run unit and API contract tests
        run: pnpm test
      - name: Build backend and frontend
        run: pnpm build
      - name: Audit production and development dependencies
        run: pnpm audit --audit-level low
      - name: Explain restricted PR image coverage
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')
        run: echo "Image publishing and image E2E are skipped for fork/Dependabot PRs. After reviewing the changes, a maintainer must put them on a trusted branch in this repository to run the image pipeline. No registry credentials are supplied to this job." >> "$GITHUB_STEP_SUMMARY"

  images:
    name: Publish commit images
    needs: quality
    if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR for commit publication
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish frontend commit
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cthit/bookit-node-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Publish backend commit
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cthit/bookit-node-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  e2e:
    name: Browser flows against published images
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      E2E_MODE: images
      BOOKIT_FRONTEND_IMAGE: ghcr.io/cthit/bookit-node-frontend:${{ github.sha }}
      BOOKIT_BACKEND_IMAGE: ghcr.io/cthit/bookit-node-backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: "24.19.0"
          version: "0.3.0"
          run-install: false
          cache: true
      - name: Install the packageManager-pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: vp install --frozen-lockfile
      - run: pnpm codegen
      - name: Install Chromium and its system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify Docker is available for Testcontainers
        run: docker info
      - name: Log in to GHCR for commit pulls
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run authenticated browser flows
        shell: bash
        run: pnpm test:e2e 2>&1 | tee e2e-run.log
      - name: Preserve failing browser traces, screenshots, videos, and logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
            e2e-run.log
          if-no-files-found: ignore
          retention-days: 7
