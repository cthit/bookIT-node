packages:
  - bookit
  - frontend

overrides:
  # Required by Vite+: https://viteplus.dev/guide/migrate-rules#vite-and-overrides
  "vite@*": npm:@voidzero-dev/vite-plus-core@1.3.0
  "vitest@*": 5.0.5
  # Prisma 7.10 pins vulnerable versions; remove when upstream includes these fixes.
  "@prisma/config>deepmerge-ts": 8.0.0
  "prisma>mysql2": 3.24.3

# Vite+ core implements Vite 8 but publishes its own 1.x version.
peerDependencyRules:
  allowedVersions:
    "vitest>vite": "1.3.0"
    "@vitest/mocker>vite": "1.3.0"
    "@tailwindcss/vite>vite": "1.3.0"
    "@vitejs/plugin-react>vite": "1.3.0"

allowBuilds:
  # Native tooling needed by Prisma and tsx. Unpinned because `pnpm deploy --legacy`
  # in the Dockerfile re-resolves versions instead of using the lockfile.
  "@prisma/engines": true
  esbuild: true
  # Version notices/checks and optional SSH acceleration are unnecessary.
  "@apollo/protobufjs": false
  protobufjs: false
  prisma: false
  cpu-features: false
  ssh2: false

auditConfig:
  ignoreGhsas:
    # braces stack exhaustion on deeply nested patterns; no patched release exists.
    # Only reached by @graphql-tools/load-files globbing our own schema files.
    - GHSA-vfj7-8cjw-p6xm
