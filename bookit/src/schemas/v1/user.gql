type User {
  sid: String @deprecated(reason: "Session identifiers are not exposed")
  jti: String @deprecated(reason: "Token identifiers are not exposed")
  given_name: String
  family_name: String
  picture: String
  sub: String
  name: String
  nickname: String
  locale: String
  cid: String
  "Gamma IDs of the super groups the user may book as."
  groups: [String]
  "The super groups the user may book as."
  super_groups: [SuperGroup!]!
  is_admin: Boolean
}

type SuperGroup {
  id: String!
  name: String!
  pretty_name: String!
}

type GammaUser {
  id: String!
  nick: String!
  first_name: String!
  last_name: String!
  "The user as Chalmers IT shows them: First \"Nick\" Last."
  display_name: String!
}

type Query {
  user: User
  "Base URL of the Gamma instance, used to link to users and groups."
  gammaUrl: String!
}
