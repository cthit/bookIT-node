version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      prisma:
        patterns: ["prisma", "@prisma/*"]
      graphql-codegen:
        patterns: ["@graphql-codegen/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
