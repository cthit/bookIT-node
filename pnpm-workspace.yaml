packages:
  - bookit
  - frontend

overrides:
  # Required by Vite+: https://viteplus.dev/guide/migrate-rules#vite-and-overrides
  "vite@*": npm:@voidzero-dev/vite-plus-core@0.3.0
  "vitest@*": 4.1.11
  # Prisma 7.10 pins vulnerable versions; remove when upstream includes these fixes.
  "@prisma/config>deepmerge-ts": 8.0.0
  "prisma>mysql2": 3.24.3

# Vite+ core implements Vite 8 but publishes its own 0.3.0 version.
peerDependencyRules:
  allowedVersions:
    "vitest>vite": "0.3.0"
    "@vitest/mocker>vite": "0.3.0"
    "@tailwindcss/vite>vite": "0.3.0"
    "@vitejs/plugin-react>vite": "0.3.0"

allowBuilds:
  # Native tooling needed by Prisma and tsx.
  "@prisma/engines@7.10.0": true
  "esbuild@0.28.2": true
  # Version notices/checks and optional SSH acceleration are unnecessary.
  "@apollo/protobufjs": false
  protobufjs: false
  prisma: false
  cpu-features: false
  ssh2: false
