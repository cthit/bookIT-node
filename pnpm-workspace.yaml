packages:
  - backend
  - frontend

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vitest: 4.1.11
  "@prisma/config>deepmerge-ts": 8.0.0
  "prisma>mysql2": 3.24.3
  "archiver-utils>glob": 13.0.6

# Vite+ exposes Vite 8.2.2 under its distribution version 0.3.0.
# These tested Vite-8 consumers otherwise warn about the alias version number.
peerDependencyRules:
  allowedVersions:
    "vitest>vite": "0.3.0"
    "@vitest/mocker>vite": "0.3.0"
    "@tailwindcss/vite>vite": "0.3.0"
    "@vitejs/plugin-react>vite": "0.3.0"

allowBuilds:
  protobufjs: true
  ssh2: false
  cpu-features: false
  "@apollo/protobufjs": true
  "@prisma/engines": true
  core-js: false
  core-js-pure: false
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - "@full-ui/headless-calendar@7.1.0"
  - "@fullcalendar/core@7.1.0"
  - "@fullcalendar/react@7.1.0"
