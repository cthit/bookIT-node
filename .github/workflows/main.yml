name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication and release tagging for the same commit.
concurrency:
  group: images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write
