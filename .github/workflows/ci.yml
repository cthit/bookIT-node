name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Types, lint, tests, build, and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: "24.19.0"
          version: "0.3.0"
          run-install: false
          cache: true
      - name: Install the packageManager-pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install approved dependencies from the lockfile
        run: vp install --frozen-lockfile
      - name: Generate GraphQL contracts and check they are committed
        run: |
          pnpm codegen
          git diff --exit-code -- backend/src/generated/schema.ts frontend/src/generated/graphql.ts
      - name: Generate Prisma client
        run: pnpm --dir backend exec prisma generate
      - name: Check strict TypeScript contracts
        run: pnpm typecheck
      - name: Check formatting and type-aware lint
        run: vp check
      - name: Run unit and API contract tests
        run: pnpm test
      - name: Build backend and frontend
        run: pnpm build
      - name: Audit production and development dependencies
        run: pnpm audit --audit-level low
      - name: Explain restricted PR image coverage
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')
        run: echo "Image publishing and image E2E are skipped for fork/Dependabot PRs. After reviewing the changes, a maintainer must put them on a trusted branch in this repository to run the image pipeline. No registry credentials are supplied to this job." >> "$GITHUB_STEP_SUMMARY"

  candidates:
    name: Publish candidate images
    needs: quality
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      frontend: ${{ steps.names.outputs.frontend }}@${{ steps.frontend.outputs.digest }}
      backend: ${{ steps.names.outputs.backend }}@${{ steps.backend.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Candidate names
        id: names
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "frontend=${repository}-frontend" >> "$GITHUB_OUTPUT"
          echo "backend=${repository}-backend" >> "$GITHUB_OUTPUT"
          echo "tag=candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR for candidate publication
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish frontend candidate
        id: frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.frontend }}:${{ steps.names.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Publish backend candidate
        id: backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.backend }}:${{ steps.names.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  e2e:
    name: Browser flows against published candidates
    needs: candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      E2E_MODE: images
      BOOKIT_FRONTEND_IMAGE: ${{ needs.candidates.outputs.frontend }}
      BOOKIT_BACKEND_IMAGE: ${{ needs.candidates.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: "24.19.0"
          version: "0.3.0"
          run-install: false
          cache: true
      - name: Install the packageManager-pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: vp install --frozen-lockfile
      - run: pnpm codegen
      - name: Install Chromium and its system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify Docker is available for Testcontainers
        run: docker info
      - name: Log in to GHCR for candidate pulls
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run authenticated browser flows
        shell: bash
        run: pnpm test:e2e 2>&1 | tee e2e-run.log
      - name: Dry-run digest promotion
        shell: bash
        run: |
          docker buildx imagetools create --dry-run --prefer-index=false "$BOOKIT_FRONTEND_IMAGE" > /dev/null
          docker buildx imagetools create --dry-run --prefer-index=false "$BOOKIT_BACKEND_IMAGE" > /dev/null
      - name: Preserve failing browser traces, screenshots, videos, and logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
            e2e-run.log
          if-no-files-found: ignore
          retention-days: 7

  promote:
    name: Promote tested digests on main
    needs: [candidates, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      BOOKIT_FRONTEND_IMAGE: ${{ needs.candidates.outputs.frontend }}
      BOOKIT_BACKEND_IMAGE: ${{ needs.candidates.outputs.backend }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to promote an outdated main run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Tag the tested manifests without rebuilding
        shell: bash
        run: |
          for image in "$BOOKIT_FRONTEND_IMAGE" "$BOOKIT_BACKEND_IMAGE"; do
            repository="${image%@*}"
            digest="${image##*@}"
            docker buildx imagetools create --prefer-index=false \
              --tag "$repository:$GITHUB_SHA" --tag "$repository:latest" "$image"
            for tag in "$GITHUB_SHA" latest; do
              actual="$(docker buildx imagetools inspect "$repository:$tag" --format '{{.Manifest.Digest}}')"
              test "$actual" = "$digest"
            done
          done
