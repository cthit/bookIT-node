services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL for the BookIT database}"
      ISSUER_BASE_URL: "${ISSUER_BASE_URL:?Set the Gamma OpenID issuer URL}"
      BASE_URL: "${BASE_URL:?Set the public BookIT URL}"
      CLIENT_ID: "${CLIENT_ID:?Set the Gamma client ID}"
      CLIENT_SECRET: "${CLIENT_SECRET:?Set the Gamma client secret}"
      API_KEY: "${API_KEY:?Set the Gamma client API key}"
      SESSION_SECRET: "${SESSION_SECRET:?Set a strong random session secret}"
      FRONTEND_URL: http://frontend:80
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PORT: "8080"
      TZ: Europe/Stockholm
      TRUST_PROXY: "${TRUST_PROXY:-0}"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

  db:
    image: postgres:12.22-alpine
    environment:
      POSTGRES_DB: bookit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASS:?Set the BookIT database password}"
      TZ: Europe/Stockholm
    volumes:
      - bookit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookit"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:5.0.14-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  bookit-db:
